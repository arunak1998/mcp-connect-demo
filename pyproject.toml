[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-connect-demo"
version = "0.1.0"
description = "A small MCP server, a plain MCP client, and an LLM agent that uses the server's tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.13.0",
    "polars>=1.32.0",
    "python-dotenv>=1.1.0",
]

[project.optional-dependencies]
# Only needed to connect an LLM to the server (src/mcp_demo/agent.py)
llm = [
    "langchain>=1.0",
    "langchain-mcp-adapters>=0.1.9",
    "langchain-openai>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
mcp-demo-server = "mcp_demo.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
